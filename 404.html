<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ページが見つかりません — cmalu ractu</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/qr/img/favicon.svg" type="image/svg+xml">
  <style>
    :root { --fg:#111827; --fg-muted:#4b5563; --fg-faint:#9ca3af; --border:#e5e7eb; --bg:#fafafa; --surface:#fff; --accent:#B91C1C; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
      color: var(--fg); background: var(--bg); line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 520px; padding: 40px 24px; text-align: center; }
    .code { font-size: 56px; font-weight: 700; color: var(--accent); margin: 0 0 4px; letter-spacing: .02em; }
    h1 { font-size: 19px; font-weight: 700; margin: 0 0 12px; }
    p { font-size: 14px; color: var(--fg-muted); margin: 0 0 28px; }
    .links { display: flex; flex-direction: column; gap: 10px; }
    .link {
      display: block; padding: 14px 18px; text-align: left;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      text-decoration: none; color: inherit; transition: border-color .15s;
    }
    .link:hover { border-color: var(--accent); }
    .link-t { font-size: 14px; font-weight: 700; margin: 0 0 3px; }
    .link-d { font-size: 12px; color: var(--fg-faint); margin: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="code">404</p>
    <h1>ページが見つかりません</h1>
    <p>お探しのページは移動または削除された可能性があります。</p>

    <div class="links">
      <a class="link" href="/">
        <p class="link-t">トップページ</p>
        <p class="link-d">公開しているツールの一覧</p>
      </a>
      <a class="link" href="/qr/">
        <p class="link-t">ぽちっとQR工房</p>
        <p class="link-d">QRコードの作成・読み取り</p>
      </a>
      <a class="link" href="/img/">
        <p class="link-t">画像を圧縮・リサイズ</p>
        <p class="link-d">アップロード不要で画像を軽くする</p>
      </a>
    </div>
  </div>
</body>
</html>
